[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "accusignals"
version = "0.1.0"
description = "Confluence-based scalping signals for Binance with order-flow, backtesting and walk-forward validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
accusignals = "accusignals.cli:main"

[tool.setuptools]
packages = ["accusignals", "accusignals.web"]

[tool.setuptools.package-data]
"accusignals.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
